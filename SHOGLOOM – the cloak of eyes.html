<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHOGLOOM — Áo choàng đầy mắt</title>
<style>
:root{--bg:#0b0a10;--panel:#14121c;--green:#6b7a2a;--lime:#b7c95a;--violet:#7b4bd6;--pink:#e24aa8;--yellow:#ffd23f;--text:#ece8f5;--muted:#9a94ad;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#2a1b4d 0%,var(--bg) 60%) var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;overflow-x:hidden}
.marquee{background:var(--yellow);color:#111;font-weight:800;white-space:nowrap;overflow:hidden;border-bottom:3px solid #111}
.marquee span{display:inline-block;padding:8px 0;animation:mq 22s linear infinite}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.lang{position:absolute;top:10px;right:12px;display:flex;gap:6px;z-index:2}.lang button{padding:6px 12px;font-size:13px;background:#2c2640;color:var(--text)}.lang button.on{background:var(--lime);color:#111}
header{position:relative;text-align:center;padding:48px 16px 24px;overflow:hidden}
h1{font-family:Impact,"Arial Black","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:clamp(48px,14vw,132px);letter-spacing:2px;margin:8px 0;line-height:1;color:var(--lime);text-shadow:3px 0 var(--pink),-3px 0 var(--violet);animation:glitch 3s infinite}
@keyframes glitch{0%,92%,100%{transform:none}94%{transform:translate(4px,-2px) skewX(6deg)}96%{transform:translate(-4px,2px) skewX(-6deg)}}
.sub{color:var(--muted);max-width:640px;margin:0 auto;font-size:18px}
.smile{width:96px;height:96px;border-radius:50% 50% 46% 46%;background:var(--yellow);margin:0 auto 8px;position:relative;box-shadow:0 0 40px #ffd23f66;animation:bob 3s ease-in-out infinite}
.smile::after{content:"";position:absolute;left:24px;right:24px;top:44px;height:30px;border-bottom:7px solid #111;border-radius:0 0 60px 60px}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
.eyes{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:22px 0 4px}
.eye{width:44px;height:28px;background:#efeaf8;border:3px solid #8d84a3;border-radius:50%;position:relative;overflow:hidden}
.eye i{position:absolute;width:16px;height:16px;border-radius:50%;background:#555;left:11px;top:5px}
main{max-width:980px;margin:0 auto;padding:0 16px 48px}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 0}
.card{background:var(--panel);border:2px solid #2c2640;border-radius:16px;overflow:hidden;position:relative;transition:transform .2s}
.card:hover{transform:rotate(-1.2deg) scale(1.02)}
.card img{display:block;width:100%;height:auto}
.card b{position:absolute;left:10px;bottom:10px;background:#000c;padding:4px 10px;border-radius:8px;font-size:13px}
.box{background:var(--panel);border:2px solid #2c2640;border-radius:16px;padding:22px;margin:18px 0}
h2{font-family:Impact,"Arial Black","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;letter-spacing:1px;color:var(--yellow);margin:0 0 10px;font-size:28px}
.eq{font-size:clamp(18px,4vw,28px);font-weight:800;text-align:center;line-height:1.5}
.eq em{font-style:normal;color:var(--pink)}.eq u{text-decoration:none;color:var(--lime)}
.ca{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:12px}
.ca code{background:#000;border:2px dashed var(--lime);padding:12px 14px;border-radius:10px;color:var(--lime);word-break:break-all;font-size:15px;max-width:100%}
button{background:var(--lime);color:#111;font-weight:800;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-size:15px}
button:hover{background:var(--yellow)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;padding:10px 0 10px 44px;position:relative;border-bottom:1px dashed #2c2640}
.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:30px;height:30px;border-radius:50%;background:var(--violet);display:grid;place-items:center;font-weight:800}
.warn{border-color:var(--pink);color:var(--muted);font-size:14px}
.warn b{color:var(--pink)}
footer{text-align:center;color:var(--muted);padding:24px;font-size:13px}
.float{position:fixed;width:34px;height:22px;background:#efeaf8;border:2px solid #8d84a3;border-radius:50%;pointer-events:none;opacity:.55;overflow:hidden;z-index:0}
.float i{position:absolute;width:12px;height:12px;border-radius:50%;background:#555;left:9px;top:3px}
@media(max-width:600px){.gallery{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<script>
(function(){
  var pupils=[];
  var row=document.getElementById('eyes');
  for(var i=0;i<7;i++){var e=document.createElement('div');e.className='eye';e.innerHTML='<i></i>';row.appendChild(e);pupils.push(e)}
  for(var j=0;j<9;j++){var f=document.createElement('div');f.className='float';f.style.left=(Math.random()*94)+'vw';f.style.top=(Math.random()*90)+'vh';f.innerHTML='<i></i>';document.body.appendChild(f);pupils.push(f)}
  function look(x,y){
    pupils.forEach(function(el){
      var r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
      var a=Math.atan2(y-cy,x-cx),p=el.firstElementChild;
      var mx=(r.width-p.offsetWidth)/2-3,my=(r.height-p.offsetHeight)/2-3;
      var bx=(r.width-p.offsetWidth)/2,by=(r.height-p.offsetHeight)/2;
      p.style.left=(bx+Math.cos(a)*mx)+'px';p.style.top=(by+Math.sin(a)*my)+'px';
    });
  }
  window.addEventListener('mousemove',function(e){look(e.clientX,e.clientY)});
  window.addEventListener('touchmove',function(e){var t=e.touches[0];look(t.clientX,t.clientY)},{passive:true});
  var btn=document.getElementById('copy');
  btn.addEventListener('click',function(){
    var t=document.getElementById('ca').textContent;
    function ok(){btn.textContent=T[L].copied;setTimeout(function(){btn.textContent=T[L].copy},1500)}
    try{navigator.clipboard.writeText(t).then(ok,function(){fb(t);ok()})}catch(e){fb(t);ok()}
  });
  function fb(t){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()}
})();
</script>
